<body>
<div class="container" id="app">
    <h2>Upload Image to Convert to WebP</h2>

    <!-- STEP 1: Upload -->
    <label for="fileInput" class="btn-upload">Upload Image</label>
    <input type="file" id="fileInput" accept="image/*">

    <div class="preview" id="preview" style="display:none;">
        <h3>Preview Gambar</h3>
        <img id="previewImg" src="" alt="Preview">
        <div style="font-weight: bold;" id="beforeSize"></div><br><br>
    </div>

    <!-- Quality Controls -->
    <div class="quality-box" style="display:none;" id="qualityBox">

        <div value="25" id="qualitySlider"></div>
        <div style="font-weight: bold;">
            <span>Set Compression Level:</span>
            
            <div class="value-compress">
                <div  id="sliderValue" style="padding:20px 0px 20px 20px;" >25</div>
                <div style="padding:20px 20px 20px 0px">%</div>
            </div>
            
        </div>

        <br><br><br>
        <div class="quality-buttons">
            <button type="button" onclick="setQuality(40)">Low</button>
            <button type="button" onclick="setQuality(60)">Medium</button>
            <button type="button" onclick="setQuality(80)">High</button>
            <button type="button" onclick="setQuality(100)">Extreme</button>
        </div>
        <button class="convert-btn" onclick="convertImage()">Convert</button>
        <button href="#" class="reset-link" onclick="resetApp()">Re-upload</button>
        <!-- <a href="#" class="reset-link" onclick="resetApp()">Re-upload</a> -->
    </div>
    
    <!-- <br><br><br><br><br> -->
    
    <!-- Result -->
    <div id="result" style="display:none;">
        <br><br><br>
        <hr>
        <br><br><br>
        <h2>Convert Results</h2>
        <div class="result-preview">
            <div class="card">
                <div class="card-inner">
                    <h3>Before</h3>
                    <img id="beforeImg">
                    <div class="info" id="beforeInfo"></div>
                </div>
                <div class="card-glare"></div>
            </div>
            <div class="card">
                <div class="card-inner">
                    <h3>After</h3>
                    <img id="afterImg">
                    <div class="info" id="afterInfo"></div>
                </div>
                <div class="card-glare"></div>
            </div>
        </div>
        <a id="downloadBtn" class="btn-download">Download WebP</a>
    </div>

    <!-- 🔹 Fullscreen Overlay -->
    <div id="fullscreenOverlay" class="fullscreen-overlay" onclick="closeFullscreen()">
        <img id="fullscreenImg" src="" alt="Fullscreen Preview">
    </div>


</div>

<script>

function openFullscreen(src) {
  const overlay = document.getElementById('fullscreenOverlay');
  const fullscreenImg = document.getElementById('fullscreenImg');
  fullscreenImg.src = src;
  overlay.style.display = 'flex';
}

function closeFullscreen() {
  document.getElementById('fullscreenOverlay').style.display = 'none';
}

// 🔹 aktifkan klik pada Before & After
document.addEventListener("DOMContentLoaded", () => {
  ["beforeImg", "afterImg"].forEach(id => {
    const img = document.getElementById(id);
    img.style.cursor = "zoom-in";
    img.addEventListener("click", () => {
      if (img.src) openFullscreen(img.src);
    });
  });
});



let originalFile = null;

const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const beforeSize = document.getElementById('beforeSize');
const qualityBox = document.getElementById('qualityBox');
const qualitySlider = document.getElementById('qualitySlider');
const sliderValue = document.getElementById('sliderValue');

const result = document.getElementById('result');
const beforeImg = document.getElementById('beforeImg');
const afterImg = document.getElementById('afterImg');
const beforeInfo = document.getElementById('beforeInfo');
const afterInfo = document.getElementById('afterInfo');
const downloadBtn = document.getElementById('downloadBtn');

fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    originalFile = file;
    const reader = new FileReader();
    reader.onload = () => {
        previewImg.src = reader.result;
        beforeSize.textContent = "Size: " + (file.size/1024).toFixed(2) + " KB";
        preview.style.display = 'block';
        qualityBox.style.display = 'block';
    };
    reader.readAsDataURL(file);
});

qualitySlider.addEventListener('input', () => {
    sliderValue.textContent = qualitySlider.value;
});

function setQuality(val) {
    qualitySlider.value = val;
    sliderValue.textContent = val;
}

function convertImage() {
    if (!originalFile) return;
    const img = new Image();
    img.src = URL.createObjectURL(originalFile);
    img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);

        // dibalik: semakin kanan makin compress
        const sliderVal = qualitySlider.value;
        const q = (100 - sliderVal) / 100;

        canvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            result.style.display = 'block';
            beforeImg.src = previewImg.src;
            beforeInfo.textContent = "Size: " + (originalFile.size/1024).toFixed(2) + " KB";
            afterImg.src = url;
            afterInfo.textContent = "Size: " + (blob.size/1024).toFixed(2) + " KB";

            // set nama file
            const baseName = originalFile.name.split('.')[0];
            const date = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
            const fileName = `webp_compress${sliderVal}_${baseName}_${date}.webp`;
            downloadBtn.href = url;
            downloadBtn.download = fileName;
        }, "image/webp", q);
    };
}


function resetApp() {
    window.location.reload();
}
</script>
</body>
